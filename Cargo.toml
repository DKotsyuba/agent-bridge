[workspace]
members = [
    "crates/bridge-core",
    "crates/bridge-client",
    "crates/bridge-protocol",
    "crates/bridge-sdk",
    "crates/bridge-adapters",
    "crates/bridge-interfaces",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.6.6"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false
repository = "https://github.com/DKotsyuba/agent-bridge"

[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
bridge-protocol = { path = "crates/bridge-protocol" }
bridge-sdk = { path = "crates/bridge-sdk" }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
signal-hook = "0.3.18"
socket2 = "0.6.5"
listenfd = "=1.0.2"
sha2 = "0.10.9"
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }
toml = "0.8.23"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true
