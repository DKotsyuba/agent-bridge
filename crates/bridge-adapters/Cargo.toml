[package]
name = "bridge-adapters"
description = "Agent Bridge native adapters: protected caller registry, root hooks and qualified Codex/Claude message carriers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
bridge-protocol.workspace = true
bridge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
signal-hook = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
listenfd.workspace = true
tungstenite.workspace = true

[dev-dependencies]
# Synthetic protected-channel integration exercises the workspace SDK itself.
bridge-sdk.workspace = true
# The crate's own fixture feature for its tests only: integration tests build
# fixture callers, which production builds (no dev-dependencies, feature off) do
# not contain.
bridge-adapters = { path = ".", features = ["test-fixtures"] }

[features]
# Exposes explicit fixture constructors for consumer tests (never for
# production builds): a test of the root-caller consumer can build a
# VerifiedCaller without a live harness.
test-fixtures = []

[lints]
workspace = true

# All integration tests build into one binary; see tests/it/main.rs.
[[test]]
name = "it"
path = "tests/it/main.rs"
