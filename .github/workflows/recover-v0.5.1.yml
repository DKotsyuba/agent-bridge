# One-use recovery: publish only the original, fully built v0.5.1 draft.
name: recover-v0.5.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-v0.5.1.yml']

permissions:
  actions: read
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify original source and package evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.5.1" --jq .sha)" = 2130a784bee07d092a1177baf4456251ede86776
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41406377288" > "$RUNNER_TEMP/ci.json"
          jq -e '.head_sha == "2130a784bee07d092a1177baf4456251ede86776" and .conclusion == "success"' "$RUNNER_TEMP/ci.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41407358424/jobs?per_page=100" > "$RUNNER_TEMP/builds.json"
          jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.conclusion == "success")' "$RUNNER_TEMP/builds.json" > /dev/null
      - name: Verify assets and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          test "$(gh release view v0.5.1 --json isDraft -q .isDraft)" = true
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          jq '[.[] | select(.tag_name == "v0.5.1" and .draft)] | if length == 1 then .[0] else error("expected one draft") end' releases.json > release.json
          for file in agent-bridge-0.5.1-linux-x86_64.tar.gz agent-bridge-0.5.1-macos-arm64.tar.gz bridge-sdk-0.5.1.tar.gz install.sh; do
            gh release download v0.5.1 --pattern "$file"
            test -s "$file"
            digest="$(jq -r --arg name "$file" '.assets[] | select(.name == $name) | .digest' release.json)"
            test "${#digest}" = 71
            test "${digest:0:7}" = sha256:
            printf '%s  %s\n' "${digest#sha256:}" "$file" >> checksums.sha256
          done
          sha256sum --check checksums.sha256
          gh release upload v0.5.1 checksums.sha256
          gh release edit v0.5.1 --draft=false
